<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>NFL Schedule</title><link rel="stylesheet" href="common.css"></head><body>
<h1>🏈 NFL Schedule</h1><div class="sub"><span id="upd">Loading…</span><button onclick="load()">Refresh</button><span id="next"></span></div>
<div class="sub"><select id="wk" onchange="load()"></select><span id="bye" class="meta"></span></div><div class="grid" id="nfl"></div>
<script src="common.js"></script><script>
let inited=false;
async function load(){document.getElementById('upd').textContent='Refreshing…';let live=false;const el=document.getElementById('nfl'),sel=document.getElementById('wk');
 try{const q=inited&&sel.value?'?'+sel.value:'';const d=await j('football/nfl/scoreboard'+q);
  if(!inited){const cal=d.leagues?.[0]?.calendar||[];const typ={'Preseason':1,'Regular Season':2,'Postseason':3};
   sel.innerHTML=cal.filter(c=>typ[c.label]).flatMap(c=>(c.entries||[]).map(e=>`<option value="seasontype=${typ[c.label]}&week=${e.value}">${esc(c.label=='Regular Season'?e.label:c.label.replace('season','')+': '+e.label)}</option>`)).join('');
   sel.value=`seasontype=${d.season?.type}&week=${d.week?.number}`;inited=true;}
  const by=(d.week?.teamsOnBye||[]).map(t=>t.abbreviation);document.getElementById('bye').textContent=by.length?'Bye: '+by.join(', '):'';
  const ev=[...(d.events||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  el.innerHTML=ev.map(e=>{const c=e.competitions[0],st=c.status.type,isl=st.state=='in';if(isl)live=true;
   const cs=[...c.competitors].sort(a=>a.homeAway=='home'?1:-1);
   return `<div class="g ${isl?'live':''}"><div class="meta">${fmt(e.date)}${tv(c)?' · '+esc(tv(c)):''}</div>${cs.map(k=>`<div class="row ${k.winner?'win':''}"><span>${k.homeAway=='home'?'@ ':''}${esc(k.team.abbreviation)}</span><b>${st.state=='pre'?'':esc(k.score)}</b></div>`).join('')}<div class="st">${isl?'<span class=livetag>LIVE</span> '+esc(st.shortDetail):st.state=='pre'?'Kickoff '+fmt(e.date):esc(st.shortDetail)}</div></div>`}).join('')||'<i>No games</i>';
 }catch(err){el.innerHTML=`<div class="err">Couldn't load NFL (${esc(err.message)})</div>`;}
 document.getElementById('upd').textContent='Last updated '+stamp()+' · source: ESPN';autoRefresh(load,live);}
load();
</script></body></html>
