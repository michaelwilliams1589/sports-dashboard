<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><meta charset="utf-8"><title>Michael's Live Scoreboard</title><link rel="stylesheet" href="common.css"></head><body>
<h1>🏈🏀 Michael's Live Scoreboard</h1>
<div class="sub"><span id="upd">Loading…</span><button onclick="load()">Refresh</button><span id="next"></span></div>
<div class="cards" id="cards"></div>
<h2 style="margin:22px 0 10px" id="nflh">NFL</h2><div class="grid" id="nfl"></div>
<script src="common.js"></script><script>
const B0='https://site.api.espn.com/apis/site/v2/sports/';
const TEAMS=[
 {p:'ou-football.html',n:'Oklahoma Sooners Football',u:'football/college-football/teams/201/schedule'},
 {p:'osu-football.html',n:'Oklahoma State Cowboys Football',u:'football/college-football/teams/197/schedule'},
 {p:'thunder.html',n:'OKC Thunder',u:'basketball/nba/teams/25/schedule',sb:'basketball/nba/scoreboard',id:'25'},
 {p:'ou-basketball.html',n:'Oklahoma Sooners Basketball',u:'basketball/mens-college-basketball/teams/201/schedule?seasontype=2',bb:1},
 {p:'osu-basketball.html',n:'Oklahoma State Cowboys Basketball',u:'basketball/mens-college-basketball/teams/197/schedule?seasontype=2',bb:1}];
let anyLive=false;
function game(e,c,label){const st=c.status.type,live=st.state==='in';if(live)anyLive=true;
 const rows=c.competitors.map(k=>`<div class="row ${k.winner?'win':''}"><span>${esc(k.team.displayName)}${k.homeAway=='home'?' (H)':''}</span><b>${st.state=='pre'?'':esc(sc(k))}</b></div>`).join('');
 return `<h3>${label}</h3><div class="meta">${c.timeValid===false?fmtD(e.date)+' · time TBD':fmt(e.date)} · ${live?'<span class=livetag>LIVE '+esc(st.shortDetail)+'</span>':esc(st.description)}${tv(c)?' · '+esc(tv(c)):''}</div>${rows}`;}
async function team(t){
 try{const d=await j(t.u);let ev=d.events||[];
  // live overlay from scoreboard (schedule endpoint can lag)
  if(t.sb){try{const s=await j(t.sb);for(const e of s.events||[]){if(e.competitions[0].competitors.some(k=>k.team.id==t.id)){const i=ev.findIndex(x=>x.id==e.id);if(i>=0)ev[i]=e;}}}catch(_){}}
  const now=Date.now();
  let last=null,nxt=null,cur=null;
  for(const e of ev){const c=e.competitions[0],s=c.status.type;if(s.state==='in')cur=e;else if(s.completed)last=e;else if(!nxt)nxt=e;}
  if(t.bb){const near=e=>e&&Math.abs(new Date(e.date)-now)<7*864e5; if(!cur&&!near(last)&&!near(nxt))return '';}
  let h=`<a href="${t.p}" class="card ${cur?'live':''}"><h2>${t.n}</h2><div class="rec">${esc(d.requestedSeason?.displayName||'')} record: ${esc(d.team?.recordSummary||'unavailable')}</div>`;
  if(cur)h+=game(cur,cur.competitions[0],'🔴 Now');
  h+=last?game(last,last.competitions[0],'Last game'):'<h3>Last game</h3><i>unavailable</i>';
  h+=nxt?game(nxt,nxt.competitions[0],'Next game'):'<h3>Next game</h3><i>unavailable</i>';
  return h+'<div class=more>Full schedule →</div></a>';
 }catch(err){return `<a href="${t.p}" class="card"><h2>${t.n}</h2><div class="err">Couldn't load (${esc(err.message)})</div></a>`;}}
async function nfl(){const el=document.getElementById('nfl');
 try{const d=await j('football/nfl/scoreboard');
  document.getElementById('nflh').textContent=`NFL Week ${d.week?.number??''}`+((d.week?.teamsOnBye||[]).length?` (bye: ${d.week.teamsOnBye.map(t=>t.abbreviation).join(', ')})`:'');
  const o={in:0,pre:1,post:2};const ev=[...d.events].sort((a,b)=>o[a.status.type.state]-o[b.status.type.state]||new Date(a.date)-new Date(b.date));
  el.innerHTML=ev.map(e=>{const c=e.competitions[0],st=c.status.type,live=st.state=='in';if(live)anyLive=true;
   const cs=[...c.competitors].sort(a=>a.homeAway=='home'?1:-1);
   return `<div class="g ${live?'live':''}"><div class="meta">${fmt(e.date)}${tv(c)?' · '+esc(tv(c)):''}</div>${cs.map(k=>`<div class="row ${k.winner?'win':''}"><span>${k.homeAway=='home'?'@ ':''}${esc(k.team.abbreviation)}</span><b>${st.state=='pre'?'':esc(k.score)}</b></div>`).join('')}<div class="st">${live?'<span class=livetag>LIVE</span> '+esc(st.shortDetail):st.state=='pre'?'Kickoff '+fmt(e.date):esc(st.shortDetail)}</div></div>`}).join('')||'<i>No games</i>';
 }catch(err){el.innerHTML=`<div class="err">Couldn't load NFL (${esc(err.message)})</div>`;}}
async function load(){anyLive=false;document.getElementById('upd').textContent='Refreshing…';
 const [c]=await Promise.all([Promise.all(TEAMS.map(team)),nfl()]);
 document.getElementById('cards').innerHTML=c.join('');
 document.getElementById('upd').textContent='Last updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'})+' CT · source: ESPN';
 autoRefresh(load,anyLive);}
load();
</script></body></html>
